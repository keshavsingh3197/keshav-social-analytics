name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-social-analytics
  cancel-in-progress: false

jobs:
  build:
    name: Build Angular App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Build production bundle
        run: npm run build -- --configuration production --base-href /

      - name: Add SPA 404 fallback and static route entrypoints
        run: |
          OUT=dist/social-analytics/browser
          [ -d "$OUT" ] || OUT=dist/frontend/browser
          cp "$OUT/index.html" "$OUT/404.html"
          for route in dashboard earnings advisor funnel; do
            mkdir -p "$OUT/$route"
            cp "$OUT/index.html" "$OUT/$route/index.html"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/social-analytics/browser

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
